[package]
name = "ncm-slint-ui"
version = "0.1.0"
edition = "2021"
description = "Slint frontend with a replaceable music API and native Rust audio runtime"

[features]
default = ["vulkan"]
vulkan = ["slint/renderer-skia-vulkan"]
hot-reload = ["slint/live-preview", "dep:notify"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
slint = { version = "~1.18.1", features = ["unstable-winit-030"] }
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"], optional = true }

native = { path = "../native", default-features = false }
ncm-api-rs = { git = "https://github.com/dddqmmx/ncm-api-rs.git", rev = "133b65bfe482e41ebccf018870d3fce07bf58eb3", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
futures-util = "0.3"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
rfd = "0.17.2"
base64 = "0.22"
sha2 = "0.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
slint-build = "~1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "~1.18.1", features = ["renderer-software"] }
