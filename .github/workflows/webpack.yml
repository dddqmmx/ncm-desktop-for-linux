name: Build and Release

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的标签（如 v1.0.0）时触发
  workflow_dispatch: # 允许手动触发，用于测试编译

jobs:
  # 首选客户端：Slint + Rust，直接产物是 release 二进制
  slint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Slint 的 Vulkan/OpenGL/软件渲染与 native 音频都需要这些系统库
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev cmake libvulkan-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            native/target/
          key: ${{ runner.os }}-slint-cargo-${{ hashFiles('Cargo.lock', 'native/Cargo.lock') }}

      - name: Check Slint UI structure
        run: python3 slint-ui/scripts/check_ui_quality.py

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Upload Slint binary
        uses: actions/upload-artifact@v4
        with:
          name: ncm-slint-ui-linux-x64
          path: target/release/ncm-slint-ui
          retention-days: 5

  # 二级客户端：Electron，沿用 electron-builder 的 AppImage 打包与发布
  electron:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: slint
    defaults:
      run:
        working-directory: electron
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      # 安装 Rust 环境（针对 napi-rs 原生模块）
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA deps
        run: |
          sudo apt-get update
          # cmake: symphonia-adapter-libopus 默认 bundled，用 cmake 编译 libopus
          # 并静态链接进 native 模块（不依赖发行版装的 libopus）。
          sudo apt-get install -y pkg-config libasound2-dev cmake

      # 缓存 Rust 编译产物
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Install dependencies
        run: npm install

      # 执行检查
      - name: Lint and Typecheck
        run: |
          npm run lint
          npm run typecheck

      # 构建项目 (包含 build:native 和 electron-vite build)
      - name: Build project
        run: npm run build

      # 使用 electron-builder 打包
      - name: Package and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "检测到 Tag，正在打包并发布到 Release..."
            npx electron-builder --linux --publish always
          else
            echo "手动触发构建，仅打包不发布..."
            npx electron-builder --linux --publish never
          fi

      # 将生成的 AppImage 上传为 Artifact，方便手动触发后下载测试
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncm-desktop-electron-linux-appimage
          path: electron/dist/*.AppImage # electron-builder 默认打包输出在 dist 目录
          retention-days: 5 # 测试包保留5天即可
